name: CI

on:
  push:
    branches: [main, dev, refactor-backend-thin-client]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build (frontend + server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm ci
          cd server && npm ci

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: cd server && npm run build

  lint:
    name: Typecheck (client + server, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm ci
          cd server && npm ci

      # Strict (no `|| true`): the two pre-existing client errors are fixed.
      - name: Typecheck client (strict)
        run: npx tsc --noEmit

      - name: Typecheck server (strict)
        run: cd server && npx tsc --noEmit

      - name: Typecheck server tests
        run: cd server && npx tsc --noEmit -p tsconfig.tests.json

  test:
    name: Unit tests (server vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm ci
          cd server && npm ci

      # Hard gate: all server unit/integration tests must pass.
      - name: Run server tests
        run: cd server && npm test

  e2e:
    name: E2E (Docker + Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    # First run vs a live container: 165/165 passed. Hard-gating now;
    # revert this line if cloud-dependent specs turn flaky.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install client deps (playwright runner)
        run: npm ci

      - name: Build Docker image
        run: |
          docker build -t buildsheet:test .
          docker images buildsheet:test

      # The app is served by the container itself (nginx :8080 -> API + /app).
      # Dummy creds are fine: pages render and the API reports degraded mode.
      - name: Start container
        run: |
          docker run -d --name buildsheet-ci \
            -p 8080:8080 \
            -e AI_KEY=ci-dummy-key \
            -e AI_PROVIDER=openai-compat \
            -e VITE_FIREBASE_PROJECT_ID=ci-dummy \
            buildsheet:test

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/v1/health; then
              echo "container healthy after ~$((i*3))s"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Container did not become healthy in time"
          docker logs buildsheet-ci | tail -50
          exit 1

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=line

      - name: Dump container logs on failure
        if: failure()
        run: docker logs buildsheet-ci | tail -100
