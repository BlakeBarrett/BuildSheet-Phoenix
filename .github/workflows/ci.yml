name: CI

on:
  push:
    branches: [main, dev, refactor-backend-thin-client]
  pull_request:
    branches: [main, dev]

env:
  NODE_VERSION: "22"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm install
          cd server && npm install

      - name: TypeScript check (frontend)
        run: npm run typecheck

      - name: TypeScript check (server)
        run: cd server && npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Build server
        run: cd server && npm run build

  test-server:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm install
          cd server && npm install

      - name: Run server unit tests (Vitest)
        run: cd server && npm test

  test-e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            server/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install deps
        run: |
          npm install
          cd server && npm install

      - name: Playwright install
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=dot

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps
        run: |
          npm install
          cd server && npm install

      - name: npm audit (frontend)
        run: npm audit --audit-level=high || true

      - name: npm audit (server)
        run: cd server && npm audit --audit-level=high || true

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, test-server, test-e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t buildsheet:test .

      - name: Verify image sizes
        run: docker images buildsheet:test
