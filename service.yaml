apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: buildsheet
  labels:
    cloud.googleapis.com/location: ${REGION}
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startupGCD: "true"
        run.googleapis.com/cpu: "2"
        run.googleapis.com/memory: "1Gi"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: ${IMAGE_URI}
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: 1000m
              memory: 512Mi
          startupProbe:
            tcpSocket:
              port: 8081
            failureThreshold: 30
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          env:
            # ── AI provider ──────────────────────────────────────────────────
            - name: AI_KEY
              value: "${AI_KEY}"
            - name: AI_PROVIDER
              value: "${AI_PROVIDER}"
            - name: AI_BASE_URL
              value: "${AI_BASE_URL}"
            - name: AI_IMAGE_BASE_URL
              value: "${AI_IMAGE_BASE_URL}"
            - name: AI_DISPLAY_NAME
              value: "${AI_DISPLAY_NAME}"
            # ── Model selection ───────────────────────────────────────────────
            - name: AI_MODEL_FAST
              value: "${AI_MODEL_FAST}"
            - name: AI_MODEL_SMART
              value: "${AI_MODEL_SMART}"
            - name: AI_MODEL_STRUCTURED
              value: "${AI_MODEL_STRUCTURED}"
            - name: AI_MODEL_IMAGE
              value: "${AI_MODEL_IMAGE}"
            - name: AI_MODEL_AUDIO
              value: "${AI_MODEL_AUDIO}"
            # ── Firebase ─────────────────────────────────────────────────────
            - name: VITE_FIREBASE_API_KEY
              value: "${VITE_FIREBASE_API_KEY}"
            - name: VITE_FIREBASE_AUTH_DOMAIN
              value: "${VITE_FIREBASE_AUTH_DOMAIN}"
            - name: VITE_FIREBASE_PROJECT_ID
              value: "${VITE_FIREBASE_PROJECT_ID}"
            - name: VITE_FIREBASE_STORAGE_BUCKET
              value: "${VITE_FIREBASE_STORAGE_BUCKET}"
            - name: VITE_FIREBASE_MESSAGING_SENDER_ID
              value: "${VITE_FIREBASE_MESSAGING_SENDER_ID}"
            - name: VITE_FIREBASE_APP_ID
              value: "${VITE_FIREBASE_APP_ID}"
            - name: VITE_FIREBASE_MEASUREMENT_ID
              value: "${VITE_FIREBASE_MEASUREMENT_ID}"
            # ── Stripe & reCAPTCHA ────────────────────────────────────────────
            - name: VITE_RECAPTCHA_SITE_KEY
              value: "${VITE_RECAPTCHA_SITE_KEY}"
            - name: VITE_STRIPE_PRO_MONTHLY_PRICE_ID
              value: "${VITE_STRIPE_PRO_MONTHLY_PRICE_ID}"
            - name: VITE_STRIPE_PRO_ANNUAL_PRICE_ID
              value: "${VITE_STRIPE_PRO_ANNUAL_PRICE_ID}"
            # ── Search & Procurement ──────────────────────────────────────────
            - name: SEARCH_API_KEY
              value: "${SEARCH_API_KEY}"
            - name: SEARXNG_BASE_URL
              value: "${SEARXNG_BASE_URL}"
            - name: FIRECRAWL_BASE_URL
              value: "${FIRECRAWL_BASE_URL}"
            - name: FIRECRAWL_API_KEY
              value: "${FIRECRAWL_API_KEY}"
            # ── Server config ────────────────────────────────────────────
            # NOTE: Do NOT set PORT here. nginx binds 8080 (the Cloud Run
            # container port). The Node API server uses its own default of 8081,
            # which is what the health probes below check.
            - name: NODE_ENV
              value: "production"
            # GOOGLE_APPLICATION_CREDENTIALS is intentionally absent.
            # Cloud Run uses Application Default Credentials (ADC) via the
            # attached service account — no file mounting needed.
            # ── Startup probe (wait for server to be ready) ───────────────
            # Note: startup probe is configured via the container lifecycle below
  traffic:
    - percent: 100
      latestRevision: true
