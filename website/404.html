<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — BuildSheet">
  <meta name="theme-color" content="#0F172A">
  <title>404 — BuildSheet</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      background: var(--color-navy-900);
      color: var(--color-navy-100);
    }

    .error-code {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(6rem, 20vw, 10rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, var(--color-accent-teal), var(--color-accent-indigo, #6366F1));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
    }

    .error-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.75rem);
      font-weight: 700;
      margin: 1rem 0 0.5rem;
    }

    .error-desc {
      font-size: 1rem;
      color: var(--color-navy-400);
      max-width: 36ch;
      margin: 0 auto 2.5rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <p class="error-code" aria-label="Error 404">404</p>
  <h1 class="error-title">Page not found</h1>
  <p class="error-desc">This page doesn't exist or has been moved. Use the links below to get back on track.</p>
  <div class="error-actions">
    <a href="/" class="btn btn--secondary">← Back to Home</a>
    <a href="/app/" class="btn btn--primary">Open Live Demo</a>
  </div>
</body>
</html>
