<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BuildSheet - Drafting Mode</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Self-hosted fonts (avoids tracker-blocking by DuckDuckGo, Brave, etc.) -->
    <style>
        @font-face {
            font-family: 'Material Symbols Rounded';
            font-style: normal;
            font-weight: 100 700;
            font-display: swap;
            src: url('/app/fonts/material-symbols-rounded.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 100 900;
            font-stretch: 100%;
            font-display: swap;
            src: url('/app/fonts/roboto-latin.woff2') format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 100 900;
            font-stretch: 100%;
            font-display: swap;
            src: url('/app/fonts/roboto-latin-ext.woff2') format('woff2');
            unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
        }
    </style>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #F0F4F9; /* M3 Surface Container */
            color: #1F1F1F;
        }
        .mono {
            font-family: 'JetBrains Mono', monospace;
        }
        /* Material Symbols Utility */
        .material-symbols-rounded {
          font-family: 'Material Symbols Rounded';
          font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
          font-size: 24px;
          font-weight: normal;
          font-style: normal;
          line-height: 1;
          letter-spacing: normal;
          text-transform: none;
          display: inline-block;
          white-space: nowrap;
          word-wrap: normal;
          direction: ltr;
          -webkit-font-feature-settings: 'liga';
          font-feature-settings: 'liga';
          -webkit-font-smoothing: antialiased;
          text-rendering: optimizeLegibility;
          -moz-osx-font-smoothing: grayscale;
          user-select: none;
          /* Prevent visible ligature text when font hasn't loaded */
          overflow: hidden;
          max-width: 1em;
          max-height: 1em;
        }
        .symbol-filled {
          font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* M3 Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #DDE3EA;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C4C7C5;
        }
    </style>
    <script>
      // Polyfill process for browser environments
      window.process = window.process || { env: {} };

      // Polyfill Object.hasOwn for older browsers (Safari < 15.4, Chrome < 93).
      // react-markdown v9 and its unified/rehype internals rely on this ES2022 API.
      if (!Object.hasOwn) {
        Object.hasOwn = function(obj, prop) {
          return Object.prototype.hasOwnProperty.call(obj, prop);
        };
      }
      
      // Initialize runtime env container for Cloud Run injection
      // This MUST happen before loading env-config.js
      window._env_ = {
        API_KEY: undefined,
        GEMINI_API_KEY: undefined,
        VITE_FIREBASE_API_KEY: undefined,
        VITE_FIREBASE_AUTH_DOMAIN: undefined,
        VITE_FIREBASE_PROJECT_ID: undefined,
        VITE_FIREBASE_STORAGE_BUCKET: undefined,
        VITE_FIREBASE_MESSAGING_SENDER_ID: undefined,
        VITE_FIREBASE_APP_ID: undefined,
        VITE_FIREBASE_MEASUREMENT_ID: undefined
      };
    </script>
    <!-- runtime config injected by env.sh -->
    <script src="/app/env-config.js"></script>

<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@18.3.1/",
    "react/": "https://esm.sh/react@18.3.1/",
    "react": "https://esm.sh/react@18.3.1",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1?deps=react@18.3.1,react-dom@18.3.1",
    "i18next": "https://esm.sh/i18next@23.10.0",
    "react-i18next": "https://esm.sh/react-i18next@14.1.0?deps=react@18.3.1,i18next@23.10.0",
    "i18next-browser-languagedetector": "https://esm.sh/i18next-browser-languagedetector@7.2.0?deps=i18next@23.10.0",
    "path": "https://esm.sh/path@^0.12.7",
    "url": "https://esm.sh/url@^0.11.4"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import './index.tsx';
    </script>
</body>
</html>
