worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    server {
        listen 8080;

        # Font files — ensure correct MIME type and long cache
        location ~* \.(woff2?|ttf|otf|eot)$ {
            root /var/www;
            try_files $uri =404;
            types {
                font/woff2 woff2;
                font/woff  woff;
                font/ttf   ttf;
            }
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Custom error pages
        error_page 404 /404.html;
        location = /404.html {
            root /var/www/marketing;
            internal;
        }

        # React SPA — served at /app/
        # With root /var/www, requests to /app/... map to /var/www/app/...
        location ^~ /app {
            root /var/www;
            try_files $uri $uri/ /app/index.html;
        }

        # Named fallback: serve the React SPA for any path not found on the marketing site.
        # This handles share URLs like /{username}/{slug} without requiring /app/ in the URL.
        location @app {
            root /var/www/app;
            try_files $uri /app/index.html;
        }

        # Marketing website — served at /
        # Static files are served directly; unrecognized paths (e.g. share URLs) fall
        # through to the React SPA via @app rather than serving marketing/index.html.
        location / {
            root /var/www/marketing;
            try_files $uri $uri/ @app;
        }
    }
}
