worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10M;

    server {
        listen 8080;

        # Font files — ensure correct MIME type and long cache
        location ~* \.(woff2?|ttf|otf|eot)$ {
            root /var/www;
            try_files $uri =404;
            types {
                font/woff2 woff2;
                font/woff  woff;
                font/ttf   ttf;
            }
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }

        # Custom error pages
        error_page 404 /404.html;
        location = /404.html {
            root /var/www/marketing;
            internal;
        }

        # Share pages — server-rendered by Express (public, no auth)
        location /share/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverse proxy for backend API server (co-located Node.js process)
        location /api/ {
            proxy_pass http://127.0.0.1:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE support — disable buffering for streaming responses
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # React SPA — served at /app/
        location ^~ /app {
            root /var/www;
            try_files $uri $uri/ /app/index.html;
        }

        # Named fallback: serve the React SPA for any path not found on the marketing site.
        location @app {
            root /var/www/app;
            try_files $uri /app/index.html;
        }

        # Marketing website — served at /
        location / {
            root /var/www/marketing;
            try_files $uri $uri/ @app;
        }
    }
}
